# Playgrounds are not listed: the landing page marker of each module shows them.
training:
  id: ATS059
  title: 'CCA: BGP and External Networking'
  description: 'Reading, playgrounds, graded labs and quizzes for CCA: BGP and External
    Networking. Egress policy, the egress gateway, BGP peering and route advertisement
    with Cilium. Technical content remains draft and labs are untested.'
  certification:
    name: Cilium Certified Associate
    code: CCA
    provider: CNCF / Linux Foundation
    domain: BGP and External Networking
    weight: 6
    competencies:
    - Egress Connectivity Requirements
    - Understand Options to Connect Cilium-managed Clusters with External Networks
modules:
- id: module-intro
  title: Introduction
  description: Audience, reading method and review process.
  content:
  - type: reading
    title: Introduction
    path: sections/intro/README.md
