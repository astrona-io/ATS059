questions:
- id: ats059-010-04-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Name the requirements of the egress gateway
  source_readings:
  - sections/section-010/module-04/course-01-requirements-and-feature-checks.md
  prompt: Which set of Helm values does the egress gateway need?
  options:
  - id: a
    text: "`egressGateway.enabled=true`, `bpf.masquerade=true` and `kubeProxyReplacement=true`."
    explanation: Correct. These three are the requirements.
  - id: b
    text: Only `egressGateway.enabled=true`.
    explanation: The feature also needs eBPF masquerading and kube-proxy replacement.
  - id: c
    text: "`egressGateway.enabled=true` and `bgpControlPlane.enabled=true`."
    explanation: BGP is not a requirement.
  correct_option: a
  explanation: Correct. These three are the requirements.
- id: ats059-010-04-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Know that a policy resource does not prove the feature
  source_readings:
  - sections/section-010/module-04/course-01-requirements-and-feature-checks.md
  prompt: A `CiliumEgressGatewayPolicy` is accepted and the partner still sees the
    node address. What is a likely cause?
  options:
  - id: a
    text: The policy name is too long.
    explanation: A name length would be refused by the API server.
  - id: b
    text: The feature is off, because the API server accepts the resource without
      it.
    explanation: Correct. Check `cilium-config` and the table of the agent.
  - id: c
    text: The partner ignores source addresses.
    explanation: The partner reads the source address of the packet.
  correct_option: b
  explanation: Correct. Check `cilium-config` and the table of the agent.
- id: ats059-010-04-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Check the table on the right agent
  source_readings:
  - sections/section-010/module-04/course-01-requirements-and-feature-checks.md
  prompt: You want to see whether the policy has an effect for the pod `shuttle`.
    On which agent do you read the eBPF table?
  options:
  - id: a
    text: On any agent, because the table is the same everywhere.
    explanation: The table is kept per agent and holds the entries for local pods.
  - id: b
    text: On the agent of the gateway node.
    explanation: The gateway node holds its own state. The pod node decides the path.
  - id: c
    text: On the agent of the node where `shuttle` runs.
    explanation: Correct. The table is kept per agent.
  correct_option: c
  explanation: Correct. The table is kept per agent.
- id: ats059-010-04-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose between egressIP and interface
  source_readings:
  - sections/section-010/module-04/course-02-gateway-nodes-and-addresses.md
  prompt: A policy sets `egressGateway.egressIP`. Who creates that address on the
    gateway node?
  options:
  - id: a
    text: You do. Cilium does not create it, so the node must already own it.
    explanation: Correct. The address must exist on the node.
  - id: b
    text: The Cilium agent, when it applies the policy.
    explanation: Cilium uses the address and does not add it.
  - id: c
    text: The Cilium operator.
    explanation: The operator does not add addresses to nodes.
  correct_option: a
  explanation: Correct. The address must exist on the node.
- id: ats059-010-04-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Know what happens with neither egressIP nor interface
  source_readings:
  - sections/section-010/module-04/course-02-gateway-nodes-and-addresses.md
  prompt: A policy sets neither `egressIP` nor `interface`. Which source address does
    the partner see?
  options:
  - id: a
    text: The pod address.
    explanation: The traffic is masqueraded at the gateway.
  - id: b
    text: The address of the gateway node toward the destination.
    explanation: Correct. The default is the node address on the route to the destination.
  - id: c
    text: No address, because the policy is invalid.
    explanation: The policy is valid.
  correct_option: b
  explanation: Correct. The default is the node address on the route to the destination.
- id: ats059-010-04-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Use a role label
  source_readings:
  - sections/section-010/module-04/course-02-gateway-nodes-and-addresses.md
  prompt: Why does a policy select the gateway node by a role label and not by name?
  options:
  - id: a
    text: Because node names cannot be used in selectors.
    explanation: A name label exists, but it ties the policy to one node.
  - id: b
    text: Because the label enables automatic failover.
    explanation: The open source version has no automatic failover.
  - id: c
    text: Replacing the node then means moving the label and the address, and the
      policy stays the same.
    explanation: Correct. The label makes the policy independent of the node name.
  correct_option: c
  explanation: Correct. The label makes the policy independent of the node name.
- id: ats059-010-04-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Limit the scope of a policy
  source_readings:
  - sections/section-010/module-04/course-03-policy-design.md
  prompt: A range must keep using the normal node path while all other traffic to
    a partner network uses the gateway. Which field serves this?
  options:
  - id: a
    text: "`excludedCIDRs`."
    explanation: Correct. Excluded ranges stay on the normal path.
  - id: b
    text: "`egressIP`."
    explanation: This field sets the source address.
  - id: c
    text: "`interface`."
    explanation: This field names the interface for the source address.
  correct_option: a
  explanation: Correct. Excluded ranges stay on the normal path.
- id: ats059-010-04-q08
  type: single_choice
  difficulty: advanced
  learning_objective: Know that the gateway policy does not allow traffic
  source_readings:
  - sections/section-010/module-04/course-03-policy-design.md
  prompt: A namespace has default deny for egress. A gateway policy selects `shuttle`
    and the partner. What else does the partner connection need?
  options:
  - id: a
    text: Nothing, the gateway policy allows the traffic.
    explanation: The gateway policy does not authorize.
  - id: b
    text: A network policy rule that allows the partner.
    explanation: Correct. The gateway policy chooses the path and the address. It
      never allows traffic.
  - id: c
    text: A second gateway policy.
    explanation: Two policies would overlap and do not add authorization.
  correct_option: b
  explanation: Correct. The gateway policy chooses the path and the address. It never
    allows traffic.
- id: ats059-010-04-q09
  type: single_choice
  difficulty: advanced
  learning_objective: Order a gateway move
  source_readings:
  - sections/section-010/module-04/course-04-changing-the-gateway.md
  prompt: Which order moves the gateway to another node with the fewest failures?
  options:
  - id: a
    text: Remove the old address, then label the new node, then change the policy.
    explanation: The pods would lose the path while the policy still points at the
      old node.
  - id: b
    text: Change the policy first, then add the address.
    explanation: The policy would point at a node without the address.
  - id: c
    text: Add and announce the new address, label the new node, change the policy,
      then remove the old label and address.
    explanation: Correct. The new path exists before the policy points at it.
  correct_option: c
  explanation: Correct. The new path exists before the policy points at it.
- id: ats059-010-04-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe open connections after a move
  source_readings:
  - sections/section-010/module-04/course-04-changing-the-gateway.md
  prompt: A connection was open before the policy moved to another gateway node. What
    happens to it?
  options:
  - id: a
    text: It does not continue on the new path, so the application must reconnect.
    explanation: Correct. Open connections do not move to the new gateway.
  - id: b
    text: It moves to the new gateway without a break.
    explanation: The new node has no state for the connection.
  - id: c
    text: It continues on the old gateway for the TTL of the policy.
    explanation: A policy has no such TTL.
  correct_option: a
  explanation: Correct. Open connections do not move to the new gateway.
