questions:
- id: ats059-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Predict the source address that an external service sees for
    traffic from a pod
  source_readings:
  - sections/section-010/module-01/course-01-the-egress-path-and-masquerading.md
  prompt: The `shuttle` pod calls the partner service outside the cluster with eBPF
    masquerading on. Which source address does the partner record?
  options:
  - id: a
    text: The address of the `shuttle` pod.
    explanation: The pod address is only valid inside the cluster and is replaced
      before the packet leaves the node.
  - id: b
    text: The address of the node that runs the pod.
    explanation: Correct. The Cilium agent rewrites the source address to the node
      address and keeps a connection entry to translate the reply back.
  - id: c
    text: The ClusterIP of the `probe` Service.
    explanation: A Service address is a destination inside the cluster and is never
      a source toward the partner.
  correct_option: b
  explanation: Correct. The Cilium agent rewrites the source address to the node address
    and keeps a connection entry to translate the reply back.
- id: ats059-final-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Write a default deny egress policy that still allows name resolution
  source_readings:
  - sections/section-010/module-01/course-02-controlling-egress-with-network-policy.md
  prompt: 'After you apply a `CiliumNetworkPolicy` with `egress: [- {}]` to `shuttle`,
    `curl http://probe/` fails with a name resolution error. What is missing?'
  options:
  - id: a
    text: A `toCIDR` rule for `0.0.0.0/0`.
    explanation: A wildcard CIDR would remove the restriction the policy exists to
      create, and does not match cluster pods.
  - id: b
    text: An ingress rule on the `probe` pods.
    explanation: The failure is at name resolution, before any connection to the `probe`
      pods.
  - id: c
    text: An egress rule to the CoreDNS pods on port 53, with a `rules.dns` section.
    explanation: Correct. Default deny blocks DNS too. The DNS rule sends queries
      through the Cilium DNS proxy and allows them.
  correct_option: c
  explanation: Correct. Default deny blocks DNS too. The DNS rule sends queries through
    the Cilium DNS proxy and allows them.
- id: ats059-final-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why a toFQDNs rule needs a DNS rule
  source_readings:
  - sections/section-010/module-01/course-02-controlling-egress-with-network-policy.md
  prompt: A policy has a `toFQDNs` rule for `api.partner.example` and no DNS rule.
    The pod resolves the name through CoreDNS. What happens to the connection?
  options:
  - id: a
    text: It is blocked, because the agent learns allowed addresses only from DNS
      answers that its DNS proxy sees.
    explanation: Correct. Without a DNS rule the queries do not pass the DNS proxy,
      so the agent never stores the answer addresses as allowed destinations.
  - id: b
    text: It is allowed, because the name is on the allowlist.
    explanation: The rule allows addresses, and the addresses come from the proxy
      cache, not from the name text.
  - id: c
    text: It is allowed only for the first five minutes.
    explanation: There is no grace period in the mechanism. Allowed addresses leave
      the maps when the TTL expires.
  correct_option: a
  explanation: Correct. Without a DNS rule the queries do not pass the DNS proxy,
    so the agent never stores the answer addresses as allowed destinations.
- id: ats059-final-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Find the failing stage of an outbound connection
  source_readings:
  - sections/section-010/module-01/course-03-source-identity-and-return-paths.md
  prompt: The name resolves, but the connection from `shuttle` hangs, while the same
    request from `drifter` works. Which stage is the most likely cause?
  options:
  - id: a
    text: A missing route on the partner for the pod CIDR.
    explanation: Both pods leave with a node address, so a missing pod route would
      affect both.
  - id: b
    text: A network policy that selects `shuttle` and does not allow the destination.
    explanation: Correct. The only difference between the two pods is the policy that
      selects one of them. The drop monitor or Hubble shows the policy verdict.
  - id: c
    text: A wrong CoreDNS Deployment.
    explanation: The name already resolves, so DNS works.
  correct_option: b
  explanation: Correct. The only difference between the two pods is the policy that
    selects one of them. The drop monitor or Hubble shows the policy verdict.
- id: ats059-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: State what an egress gateway gives an external allowlist
  source_readings:
  - sections/section-010/module-02/course-01-why-a-fixed-source-address.md
  prompt: The partner allowlist can hold one address. Which design gives it a fixed
    source address for the `shuttle` pod?
  options:
  - id: a
    text: Adding every node address to the allowlist.
    explanation: That works but the allowlist then holds many addresses and still
      changes when nodes change.
  - id: b
    text: Adding the `shuttle` pod address to the allowlist.
    explanation: Pod addresses are temporary and are replaced by masquerading anyway.
  - id: c
    text: A `CiliumEgressGatewayPolicy` that selects `shuttle` and names a gateway
      node and an `egressIP`.
    explanation: Correct. The policy sends matching traffic through the gateway node,
      which uses the egress address as source.
  correct_option: c
  explanation: Correct. The policy sends matching traffic through the gateway node,
    which uses the egress address as source.
- id: ats059-final-q06
  type: single_choice
  difficulty: advanced
  learning_objective: Explain that a gateway policy does not authorize traffic
  source_readings:
  - sections/section-010/module-02/course-03-gateway-policy-failures-and-network-policy.md
  prompt: "`shuttle` matches a `CiliumEgressGatewayPolicy`, and a `CiliumNetworkPolicy`
    denies its egress. What does the partner see?"
  options:
  - id: a
    text: Nothing. The network policy still drops the connection, because the gateway
      policy only chooses the source address.
    explanation: Correct. The gateway policy selects the path and source address.
      Authorization stays with the network policy.
  - id: b
    text: The gateway address, because the gateway policy overrides the network policy.
    explanation: Neither policy overrides the other, and the connection never leaves
      the node.
  - id: c
    text: The node address of the pod.
    explanation: The packet is dropped before it can be sent with any source address.
  correct_option: a
  explanation: Correct. The gateway policy selects the path and source address. Authorization
    stays with the network policy.
- id: ats059-final-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Tell eBGP from iBGP by autonomous system number
  source_readings:
  - sections/section-020/module-01/course-01-bgp-for-kubernetes-engineers.md
  prompt: The cluster nodes use autonomous system 64513 and the external router uses
    64512. Which session type is this?
  options:
  - id: a
    text: Internal BGP (iBGP), because both numbers are private.
    explanation: iBGP needs equal numbers, and private numbers do not make sessions
      internal.
  - id: b
    text: External BGP (eBGP), because the numbers differ.
    explanation: Correct. Peers with different autonomous system numbers form an eBGP
      session.
  - id: c
    text: No session, because the numbers must be equal.
    explanation: Equal numbers are required only for iBGP.
  correct_option: b
  explanation: Correct. Peers with different autonomous system numbers form an eBGP
    session.
- id: ats059-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Assign roles to the Cilium BGP resources
  source_readings:
  - sections/section-020/module-01/course-02-the-cilium-bgp-resources.md
  prompt: Which resource holds the timers and graceful restart settings of a peer?
  options:
  - id: a
    text: "`CiliumBGPAdvertisement`."
    explanation: The advertisement says which prefixes to announce.
  - id: b
    text: "`CiliumBGPNodeConfig`."
    explanation: The node config is generated by the operator and is not the place
      to write options.
  - id: c
    text: "`CiliumBGPPeerConfig`."
    explanation: Correct. The peer config holds connection options. The cluster config
      references it by name for each peer.
  correct_option: c
  explanation: Correct. The peer config holds connection options. The cluster config
    references it by name for each peer.
- id: ats059-final-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Read the session state of a peering
  source_readings:
  - sections/section-020/module-01/course-03-bringing-up-a-peering-session.md
  prompt: Where does a validation or an operator read whether a worker established
    its session?
  options:
  - id: a
    text: In the status of the `CiliumBGPNodeConfig` resource of that node.
    explanation: Correct. The node config is generated per node and its status lists
      each peer with its state.
  - id: b
    text: In the `spec` of the `CiliumBGPClusterConfig`.
    explanation: The cluster config spec holds the desired configuration, not session
      state.
  - id: c
    text: In the log of the CoreDNS pods.
    explanation: CoreDNS does not take part in BGP.
  correct_option: a
  explanation: Correct. The node config is generated per node and its status lists
    each peer with its state.
- id: ats059-final-q10
  type: single_choice
  difficulty: beginner
  learning_objective: Choose the advertisement type for pod prefixes
  source_readings:
  - sections/section-020/module-02/course-01-advertising-pod-and-service-addresses.md
  prompt: Which advertisement type announces the pod prefix that a node owns?
  options:
  - id: a
    text: "`Service` with `ClusterIP`."
    explanation: That type announces Service addresses, not pod prefixes.
  - id: b
    text: "`PodCIDR`."
    explanation: Correct. The `PodCIDR` type announces the pod prefix of each selected
      node.
  - id: c
    text: "`CiliumPodIPPool` only."
    explanation: That type announces pool prefixes of pod IPAM pools, which is a different
      source.
  correct_option: b
  explanation: Correct. The `PodCIDR` type announces the pod prefix of each selected
    node.
- id: ats059-final-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Connect load balancer IPAM to an advertisement
  source_readings:
  - sections/section-020/module-02/course-02-load-balancer-addresses-from-a-pool.md
  prompt: A `LoadBalancer` Service stays without an external address. What does Cilium
    need before BGP can announce it?
  options:
  - id: a
    text: A second peer with another autonomous system number.
    explanation: Extra peers do not assign addresses.
  - id: b
    text: A `CiliumEgressGatewayPolicy`.
    explanation: The gateway policy controls egress source addresses, not Service
      addresses.
  - id: c
    text: A `CiliumLoadBalancerIPPool` with a block that Cilium can assign addresses
      from.
    explanation: Correct. LB IPAM assigns the address from a pool, and the advertisement
      then announces it.
  correct_option: c
  explanation: Correct. LB IPAM assigns the address from a pool, and the advertisement
    then announces it.
- id: ats059-final-q12
  type: single_choice
  difficulty: advanced
  learning_objective: Use timers for faster failure detection
  source_readings:
  - sections/section-020/module-02/course-03-connection-options-and-failures.md
  prompt: Cilium has no BFD. How do you shorten the time to detect a dead peer?
  options:
  - id: a
    text: Lower the hold time and keepalive timers in `CiliumBGPPeerConfig`.
    explanation: Correct. The timers set how long the session waits before it declares
      a peer down. The minimum hold time is 3 seconds.
  - id: b
    text: Enable BFD in the peer config.
    explanation: The peer config has no BFD option.
  - id: c
    text: Remove graceful restart from the router.
    explanation: Graceful restart is about keeping routes during a restart, not about
      detection.
  correct_option: a
  explanation: Correct. The timers set how long the session waits before it declares
    a peer down. The minimum hold time is 3 seconds.
- id: ats059-final-q13
  type: single_choice
  difficulty: beginner
  learning_objective: Explain why a name-based rule needs a DNS rule
  source_readings:
  - sections/section-010/module-03/course-01-how-a-fqdn-rule-works.md
  prompt: 'A policy allows `toFQDNs` with `matchName: partner.lab.test` and has no
    DNS rule. The pod resolves the name and connects. What happens?'
  options:
  - id: a
    text: The connection is dropped, because the agent never sees the DNS answer and
      has no address for the name.
    explanation: Correct. The DNS proxy learns the address from the answer. Without
      a DNS rule the proxy is not in the path.
  - id: b
    text: The connection works, because the agent reads the name from the packet.
    explanation: A packet carries addresses only, not names.
  - id: c
    text: The connection works for one minute and is then dropped.
    explanation: There is no initial grace period. Without the DNS rule nothing is
      learned.
  correct_option: a
  explanation: Correct. The DNS proxy learns the address from the answer. Without
    a DNS rule the proxy is not in the path.
- id: ats059-final-q14
  type: single_choice
  difficulty: advanced
  learning_objective: Apply deny precedence
  source_readings:
  - sections/section-010/module-03/course-03-entities-services-and-endpoints.md
  prompt: 'A policy allows `toEntities: [world]` and also has an `egressDeny` rule
    for `10.0.0.0/8`. A pod connects to `10.1.2.3`. What happens?'
  options:
  - id: a
    text: The connection works, because the more specific allow comes first.
    explanation: There is no order by specificity between allow and deny.
  - id: b
    text: The connection is dropped, because a deny rule wins over every allow rule.
    explanation: Correct. Deny rules take precedence, which makes a wide allow with
      a few denies a workable pattern.
  - id: c
    text: The connection works, because `world` includes private ranges.
    explanation: The deny rule applies whatever the allow rule includes.
  correct_option: b
  explanation: Correct. Deny rules take precedence, which makes a wide allow with
    a few denies a workable pattern.
- id: ats059-final-q15
  type: single_choice
  difficulty: beginner
  learning_objective: Name the requirements of the egress gateway
  source_readings:
  - sections/section-010/module-04/course-01-requirements-and-feature-checks.md
  prompt: Which set of Helm values does the egress gateway need?
  options:
  - id: a
    text: "`egressGateway.enabled=true`, `bpf.masquerade=true` and `kubeProxyReplacement=true`."
    explanation: Correct. These three are the requirements.
  - id: b
    text: Only `egressGateway.enabled=true`.
    explanation: The feature also needs eBPF masquerading and kube-proxy replacement.
  - id: c
    text: "`egressGateway.enabled=true` and `bgpControlPlane.enabled=true`."
    explanation: BGP is not a requirement.
  correct_option: a
  explanation: Correct. These three are the requirements.
- id: ats059-final-q16
  type: single_choice
  difficulty: advanced
  learning_objective: Know that the gateway policy does not allow traffic
  source_readings:
  - sections/section-010/module-04/course-03-policy-design.md
  prompt: A namespace has default deny for egress. A gateway policy selects `shuttle`
    and the partner. What else does the partner connection need?
  options:
  - id: a
    text: Nothing, the gateway policy allows the traffic.
    explanation: The gateway policy does not authorize.
  - id: b
    text: A network policy rule that allows the partner.
    explanation: Correct. The gateway policy chooses the path and the address. It
      never allows traffic.
  - id: c
    text: A second gateway policy.
    explanation: Two policies would overlap and do not add authorization.
  correct_option: b
  explanation: Correct. The gateway policy chooses the path and the address. It never
    allows traffic.
- id: ats059-final-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: Write the policy
  source_readings:
  - sections/section-020/module-03/course-02-the-announcement-policy.md
  prompt: 'A `CiliumL2AnnouncementPolicy` should announce load balancer addresses
    of Services with the label `announce: l2`. Which fields do you set?'
  options:
  - id: a
    text: "`serviceSelector` with that label and `loadBalancerIPs: true`."
    explanation: Correct. The selector chooses the Services and the flag chooses the
      address type.
  - id: b
    text: "`podSelector` and `externalIPs: true`."
    explanation: The selector is for Services, and the flag is for external IPs.
  - id: c
    text: "`nodeSelector` only."
    explanation: The node selector chooses nodes, not Services.
  correct_option: a
  explanation: Correct. The selector chooses the Services and the flag chooses the
    address type.
- id: ats059-final-q18
  type: single_choice
  difficulty: advanced
  learning_objective: Explain failover
  source_readings:
  - sections/section-020/module-03/course-03-leases-failover-and-limits.md
  prompt: The node that holds the lease stops. What happens next?
  options:
  - id: a
    text: Nothing, because all nodes answer all the time.
    explanation: Only the holder answers.
  - id: b
    text: The lease expires, another selected node takes it and announces the address
      again.
    explanation: Correct. The failover time depends on the lease timing.
  - id: c
    text: The Service gets a new address from the pool.
    explanation: The address stays the same.
  correct_option: b
  explanation: Correct. The failover time depends on the lease timing.
- id: ats059-final-q19
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain a community
  source_readings:
  - sections/section-020/module-04/course-02-route-attributes-communities-and-preference.md
  prompt: What does a standard community do by itself?
  options:
  - id: a
    text: It raises the priority of the route on every router.
    explanation: Priority needs a policy or local preference.
  - id: b
    text: Nothing. It is a tag, and the router needs a policy that matches it.
    explanation: Correct. Verify the effect on the router.
  - id: c
    text: It stops the route from leaving the cluster.
    explanation: Only a well-known community such as `no-export` has a fixed meaning.
  correct_option: b
  explanation: Correct. Verify the effect on the router.
- id: ats059-final-q20
  type: single_choice
  difficulty: advanced
  learning_objective: Find a silent fault
  source_readings:
  - sections/section-020/module-04/course-03-troubleshooting-a-route-that-does-not-arrive.md
  prompt: 'The peer configuration selects `advertise: bgp`. The advertisement has
    the label `advertise: bgpp`. What does Kubernetes do?'
  options:
  - id: a
    text: It refuses the advertisement.
    explanation: Labels are free text.
  - id: b
    text: It accepts both and the advertisement stays unused, with no error.
    explanation: Correct. A label typo is valid and silent.
  - id: c
    text: It sends the route with a default community.
    explanation: No route is sent.
  correct_option: b
  explanation: Correct. A label typo is valid and silent.
