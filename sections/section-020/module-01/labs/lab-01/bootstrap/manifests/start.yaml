apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: curlimages/curl:8.22.0
    command: ["sleep", "86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: curlimages/curl:8.22.0
    command: ["sleep", "86400"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: mccutchen/go-httpbin:2.25.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
  ports:
  - port: 80
    targetPort: 8080
